# Describes this project to Python's packaging tools (pip, uv, ...)

[build-system]
# The tool that turns the src folder into an installable package
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "my-evox"
version = "0.1.0"
description = "A re-implementation of EvoX: evolving the search strategy of LLM-driven evolution"
readme = "README.md"
requires-python = ">=3.11"
# Third-party packages the code needs to run
dependencies = [
    "openai>=1.0",  # talks to LLM servers that offer the OpenAI-compatible interface
    "pyyaml>=6",    # reads the problem files
]

[project.optional-dependencies]
# Tools needed only while developing; installed with: pip install -e ".[dev]"
dev = [
    "mypy>=1.10",    # type checker: finds type mistakes without running the code
    "ruff>=0.6",     # linter and formatter: finds common bugs and keeps the style uniform
    "types-PyYAML",  # type information for pyyaml, which mypy needs
]

[tool.setuptools.package-data]
# The built-in strategies' code, read as text and run like a strategy the strategy model writes
my_evox = ["builtin_strategies/*.py"]

[tool.setuptools.packages.find]
# Tells setuptools that the package lives inside the src folder
where = ["src"]

[tool.mypy]
# The folders mypy checks when run with no arguments
files = ["src", "scripts", "tests"]
# Not checked: the parity tests' programs, written as an LLM writes them, and the built-in
# strategies, code run in a strategy's namespace rather than modules
exclude = ["^tests/parity/[^/]+/", "^src/my_evox/builtin_strategies/"]
# Where mypy finds the my_evox package when checking a single file
mypy_path = "src"
# Turn on every check, including "every function must have type hints"
strict = true
# Use mypy's pure-Python parser: Windows Application Control blocks the faster native one
native_parser = false

[tool.ruff]
# Maximum line length, for both the linter and the formatter
line-length = 100
# The oldest Python version the code must keep working on
target-version = "py311"
# skydiscover's problem files stay as skydiscover wrote them (D3); the parity tests' programs
# are written as an LLM writes them; the built-in strategies use names their namespace gives
# them; the code in Markdown files is laid out by hand, to be read
extend-exclude = [
    "problems/*/initial_program.py",
    "problems/*/evaluator",
    "tests/parity/*/",
    "src/my_evox/builtin_strategies",
    "*.md",
]

[tool.ruff.lint]
# Rule families to enforce:
#   E, W = style errors and warnings    F = real mistakes (unused or undefined names)
#   I    = import order                 B = common bug patterns
#   UP   = outdated syntax              N = naming conventions
select = ["E", "W", "F", "I", "B", "UP", "N"]
# Exceptions may be named for what happened (StrategyRejected), without an "Error" suffix
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# skydiscover's operator templates are kept verbatim (D14), long lines included
"src/my_evox/operators.py" = ["E501"]
